<!DOCTYPE html>
<html lang="zh-TW" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>待辦事項管理員 TaskMaster</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
        }
        .task-enter {
            animation: slideIn 0.3s ease-out forwards;
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #475569;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-full flex flex-col transition-colors duration-200">

    <!-- Notification Toast Container -->
    <div id="toastContainer" class="fixed top-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <div class="max-w-4xl w-full mx-auto p-4 sm:p-6 lg:p-8 flex-1 flex flex-col">
        <!-- App Header -->
        <header class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
            <div>
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center text-white shadow-lg shadow-sky-500/30">
                        <i class="fa-solid font-bold fa-check-double text-lg"></i>
                    </div>
                    <div>
                        <h1 class="text-2xl sm:text-3xl font-bold bg-gradient-to-r from-sky-600 via-indigo-600 to-purple-600 bg-clip-text text-transparent dark:from-sky-400 dark:to-purple-400">
                            TaskMaster 待辦清單
                        </h1>
                        <p id="currentDateText" class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 font-medium"></p>
                    </div>
                </div>
            </div>

            <!-- Controls (Theme Toggle & Data Actions) -->
            <div class="flex items-center gap-2 self-end sm:self-auto">
                <button id="themeToggleBtn" title="切換深色/淺色模式" class="p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition shadow-sm">
                    <i id="themeIcon" class="fa-solid fa-moon"></i>
                </button>
                <button id="exportDataBtn" title="匯出資料 JSON" class="px-3 py-2 text-xs font-medium rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition shadow-sm flex items-center gap-1.5">
                    <i class="fa-solid fa-download"></i> <span class="hidden sm:inline">匯出</span>
                </button>
                <label id="importDataLabel" title="匯入資料 JSON" class="px-3 py-2 text-xs font-medium rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition shadow-sm flex items-center gap-1.5 cursor-pointer">
                    <i class="fa-solid fa-upload"></i> <span class="hidden sm:inline">匯入</span>
                    <input type="file" id="importDataInput" accept=".json" class="hidden">
                </label>
            </div>
        </header>

        <!-- Add Task Card -->
        <section class="bg-white dark:bg-slate-800 rounded-2xl p-4 sm:p-5 shadow-sm border border-slate-200/80 dark:border-slate-700/80 mb-6">
            <form id="addTaskForm" class="flex flex-col gap-3">
                <div class="flex flex-col sm:flex-row gap-3">
                    <div class="relative flex-1">
                        <i class="fa-solid fa-plus absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="text" id="taskTitleInput" placeholder="準備做些什麼事情呢？" required
                            class="w-full pl-10 pr-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-sky-500/50 focus:border-sky-500 text-sm sm:text-base transition">
                    </div>
                    <button type="submit" class="w-full sm:w-auto px-6 py-3 bg-sky-600 hover:bg-sky-700 text-white font-medium text-sm sm:text-base rounded-xl transition shadow-md shadow-sky-500/20 active:scale-95 flex items-center justify-center gap-2">
                        <i class="fa-solid fa-plus"></i> 新增任務
                    </button>
                </div>

                <!-- Secondary Options (Category, Priority, Due Date) -->
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-1">
                    <!-- Category Select -->
                    <div class="flex items-center gap-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-1.5">
                        <i class="fa-solid fa-folder text-slate-400 text-xs"></i>
                        <select id="taskCategoryInput" class="bg-transparent text-xs sm:text-sm text-slate-700 dark:text-slate-200 w-full focus:outline-none cursor-pointer">
                            <option value="一般" class="dark:bg-slate-800">📁 一般</option>
                            <option value="工作" class="dark:bg-slate-800">💼 工作</option>
                            <option value="個人" class="dark:bg-slate-800">👤 個人</option>
                            <option value="購物" class="dark:bg-slate-800">🛒 購物</option>
                            <option value="學習" class="dark:bg-slate-800">📚 學習</option>
                        </select>
                    </div>

                    <!-- Priority Select -->
                    <div class="flex items-center gap-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-1.5">
                        <i class="fa-solid fa-flag text-slate-400 text-xs"></i>
                        <select id="taskPriorityInput" class="bg-transparent text-xs sm:text-sm text-slate-700 dark:text-slate-200 w-full focus:outline-none cursor-pointer">
                            <option value="low" class="dark:bg-slate-800">🟢 低優先度</option>
                            <option value="medium" selected class="dark:bg-slate-800">🟡 中優先度</option>
                            <option value="high" class="dark:bg-slate-800">🔴 高優先度</option>
                        </select>
                    </div>

                    <!-- Due Date Input -->
                    <div class="flex items-center gap-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-1.5">
                        <i class="fa-regular fa-calendar text-slate-400 text-xs"></i>
                        <input type="date" id="taskDueDateInput" class="bg-transparent text-xs sm:text-sm text-slate-700 dark:text-slate-200 w-full focus:outline-none cursor-pointer">
                    </div>
                </div>
            </form>
        </section>

        <!-- Progress Bar & Stats -->
        <section class="bg-white dark:bg-slate-800 rounded-2xl p-4 shadow-sm border border-slate-200/80 dark:border-slate-700/80 mb-6">
            <div class="flex items-center justify-between text-xs sm:text-sm text-slate-600 dark:text-slate-300 font-medium mb-2">
                <span class="flex items-center gap-1.5">
                    <i class="fa-solid fa-chart-line text-sky-500"></i> 完成進度
                </span>
                <span id="statsText">0% (0 / 0 已完成)</span>
            </div>
            <div class="w-full h-2.5 bg-slate-100 dark:bg-slate-700 rounded-full overflow-hidden">
                <div id="progressBar" class="h-full bg-gradient-to-r from-sky-500 to-indigo-600 w-0 transition-all duration-500"></div>
            </div>
        </section>

        <!-- Filter & Search Controls -->
        <section class="flex flex-col md:flex-row items-stretch md:items-center justify-between gap-3 mb-4">
            <!-- Category Tabs -->
            <div class="flex items-center gap-1 overflow-x-auto pb-1 md:pb-0 scrollbar-none" id="categoryFilterContainer">
                <button data-filter="all" class="filter-tab active px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-medium bg-sky-600 text-white transition whitespace-nowrap shadow-sm">
                    全部
                </button>
                <button data-filter="active" class="filter-tab px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-medium bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-700 transition whitespace-nowrap">
                    進行中
                </button>
                <button data-filter="completed" class="filter-tab px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-medium bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-700 transition whitespace-nowrap">
                    已完成
                </button>
            </div>

            <!-- Search and Sort Bar -->
            <div class="flex items-center gap-2">
                <div class="relative flex-1 sm:w-48">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                    <input type="text" id="searchInput" placeholder="搜尋事項..." 
                        class="w-full pl-8 pr-3 py-1.5 text-xs sm:text-sm rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-sky-500/50">
                </div>
                <select id="sortSelect" class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 text-xs sm:text-sm rounded-xl px-2.5 py-1.5 focus:outline-none cursor-pointer">
                    <option value="created-desc">🆕 最新建立</option>
                    <option value="created-asc">⏳ 最早建立</option>
                    <option value="priority-desc">🔥 優先度最高</option>
                    <option value="date-asc">📅 到期日最近</option>
                </select>
            </div>
        </section>

        <!-- Task List Container -->
        <main class="flex-1 flex flex-col">
            <ul id="taskList" class="flex flex-col gap-2.5">
                <!-- Task Items inserted via JavaScript -->
            </ul>

            <!-- Empty State -->
            <div id="emptyState" class="hidden flex-1 flex flex-col items-center justify-center p-8 text-center my-8">
                <div class="w-20 h-20 bg-slate-100 dark:bg-slate-800 rounded-full flex items-center justify-center text-slate-400 text-3xl mb-3">
                    <i class="fa-regular fa-clipboard"></i>
                </div>
                <h3 class="text-base font-semibold text-slate-700 dark:text-slate-300">沒有任何待辦事項</h3>
                <p class="text-xs sm:text-sm text-slate-400 max-w-xs mt-1">目前沒有找到符合條件的任務，試著新增一個或調整搜尋條件吧！</p>
            </div>
        </main>

        <!-- Task List Footer Actions -->
        <footer class="mt-6 pt-4 border-t border-slate-200/80 dark:border-slate-800 flex flex-wrap items-center justify-between gap-3 text-xs sm:text-sm text-slate-500 dark:text-slate-400">
            <span id="itemsLeftCount">0 個未完成項目</span>
            <div class="flex items-center gap-3">
                <button id="clearCompletedBtn" class="hover:text-red-500 transition flex items-center gap-1 font-medium disabled:opacity-40 disabled:pointer-events-none">
                    <i class="fa-regular fa-trash-can"></i> 清除已完成項目
                </button>
            </div>
        </footer>
    </div>

    <!-- Edit Task Modal -->
    <div id="editModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-200">
        <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-md w-full p-6 shadow-xl border border-slate-200 dark:border-slate-700 transform scale-95 transition-transform duration-200" id="editModalContent">
            <h3 class="text-lg font-bold text-slate-800 dark:text-slate-100 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-pen-to-square text-sky-500"></i> 編輯待辦事項
            </h3>
            <form id="editTaskForm" class="flex flex-col gap-4">
                <input type="hidden" id="editTaskId">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">任務名稱</label>
                    <input type="text" id="editTaskTitle" required class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-100 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">分類</label>
                        <select id="editTaskCategory" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-100 text-sm focus:outline-none">
                            <option value="一般">📁 一般</option>
                            <option value="工作">💼 工作</option>
                            <option value="個人">👤 個人</option>
                            <option value="購物">🛒 購物</option>
                            <option value="學習">📚 學習</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">優先度</label>
                        <select id="editTaskPriority" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-100 text-sm focus:outline-none">
                            <option value="low">🟢 低優先度</option>
                            <option value="medium">🟡 中優先度</option>
                            <option value="high">🔴 高優先度</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">到期日期</label>
                    <input type="date" id="editTaskDueDate" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-100 text-sm focus:outline-none">
                </div>
                <div class="flex items-center justify-end gap-2 pt-2">
                    <button type="button" id="cancelEditBtn" class="px-4 py-2 rounded-xl border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 text-sm hover:bg-slate-100 dark:hover:bg-slate-700 transition">
                        取消
                    </button>
                    <button type="submit" class="px-4 py-2 rounded-xl bg-sky-600 hover:bg-sky-700 text-white text-sm font-medium transition shadow-md shadow-sky-500/20">
                        儲存變更
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Custom Confirm Dialog Modal -->
    <div id="confirmModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-200">
        <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-sm w-full p-6 shadow-xl border border-slate-200 dark:border-slate-700 text-center">
            <div class="w-12 h-12 rounded-full bg-red-100 dark:bg-red-900/30 text-red-500 flex items-center justify-center mx-auto mb-3 text-xl">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h3 id="confirmTitle" class="text-base font-bold text-slate-800 dark:text-slate-100 mb-1">確認操作</h3>
            <p id="confirmMessage" class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mb-5">您確定要執行此操作嗎？</p>
            <div class="flex items-center justify-center gap-3">
                <button id="confirmCancelBtn" class="w-full py-2 rounded-xl border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 text-sm hover:bg-slate-100 dark:hover:bg-slate-700 transition">
                    取消
                </button>
                <button id="confirmOkBtn" class="w-full py-2 rounded-xl bg-red-600 hover:bg-red-700 text-white text-sm font-medium transition shadow-md shadow-red-600/20">
                    確認刪除
                </button>
            </div>
        </div>
    </div>

    <script>
        // App State
        let tasks = [];
        let currentFilter = 'all';
        let searchQuery = '';
        let currentSort = 'created-desc';
        let confirmCallback = null;

        // DOM Elements
        const taskList = document.getElementById('taskList');
        const emptyState = document.getElementById('emptyState');
        const addTaskForm = document.getElementById('addTaskForm');
        const taskTitleInput = document.getElementById('taskTitleInput');
        const taskCategoryInput = document.getElementById('taskCategoryInput');
        const taskPriorityInput = document.getElementById('taskPriorityInput');
        const taskDueDateInput = document.getElementById('taskDueDateInput');
        const searchInput = document.getElementById('searchInput');
        const sortSelect = document.getElementById('sortSelect');
        const categoryFilterContainer = document.getElementById('categoryFilterContainer');
        const progressBar = document.getElementById('progressBar');
        const statsText = document.getElementById('statsText');
        const itemsLeftCount = document.getElementById('itemsLeftCount');
        const clearCompletedBtn = document.getElementById('clearCompletedBtn');
        const currentDateText = document.getElementById('currentDateText');

        // Theme Toggle
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const themeIcon = document.getElementById('themeIcon');

        // Edit Modal Elements
        const editModal = document.getElementById('editModal');
        const editModalContent = document.getElementById('editModalContent');
        const editTaskForm = document.getElementById('editTaskForm');
        const editTaskId = document.getElementById('editTaskId');
        const editTaskTitle = document.getElementById('editTaskTitle');
        const editTaskCategory = document.getElementById('editTaskCategory');
        const editTaskPriority = document.getElementById('editTaskPriority');
        const editTaskDueDate = document.getElementById('editTaskDueDate');
        const cancelEditBtn = document.getElementById('cancelEditBtn');

        // Confirm Modal Elements
        const confirmModal = document.getElementById('confirmModal');
        const confirmTitle = document.getElementById('confirmTitle');
        const confirmMessage = document.getElementById('confirmMessage');
        const confirmOkBtn = document.getElementById('confirmOkBtn');
        const confirmCancelBtn = document.getElementById('confirmCancelBtn');

        // Toast Notification System
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `pointer-events-auto flex items-center gap-2.5 px-4 py-3 rounded-xl shadow-lg border text-xs sm:text-sm font-medium transition-all duration-300 transform translate-x-8 opacity-0`;

            const icons = {
                success: 'fa-circle-check text-emerald-500',
                error: 'fa-circle-exclamation text-red-500',
                info: 'fa-circle-info text-sky-500'
            };

            const bgClasses = 'bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-100';

            toast.className += ` ${bgClasses}`;
            toast.innerHTML = `<i class="fa-solid ${icons[type] || icons.info} text-base"></i><span>${message}</span>`;

            container.appendChild(toast);

            // Animate in
            requestAnimationFrame(() => {
                toast.classList.remove('translate-x-8', 'opacity-0');
            });

            // Auto Remove
            setTimeout(() => {
                toast.classList.add('translate-x-8', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // LocalStorage Initialization & Persistence
        function loadTasks() {
            try {
                const stored = localStorage.getItem('taskmaster_tasks');
                if (stored) {
                    tasks = JSON.parse(stored);
                } else {
                    // Default Sample Tasks
                    tasks = [
                        {
                            id: '1',
                            title: '歡迎使用 TaskMaster 待辦清單！',
                            category: '一般',
                            priority: 'high',
                            dueDate: getTodayDateString(),
                            completed: false,
                            createdAt: Date.now() - 100000
                        },
                        {
                            id: '2',
                            title: '點擊核取方塊即可標記完成任務',
                            category: '學習',
                            priority: 'medium',
                            dueDate: '',
                            completed: true,
                            createdAt: Date.now() - 50000
                        }
                    ];
                    saveTasks();
                }
            } catch (e) {
                console.error("無法讀取 LocalStorage", e);
                tasks = [];
            }
        }

        function saveTasks() {
            try {
                localStorage.setItem('taskmaster_tasks', JSON.stringify(tasks));
            } catch (e) {
                console.error("無法寫入 LocalStorage", e);
                showToast("儲存失敗，可能超出空間限制", "error");
            }
        }

        function getTodayDateString() {
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd}`;
        }

        // Theme Management
        function initTheme() {
            const savedTheme = localStorage.getItem('taskmaster_theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                document.documentElement.classList.add('dark');
                themeIcon.className = 'fa-solid fa-sun text-amber-400';
            } else {
                document.documentElement.classList.remove('dark');
                themeIcon.className = 'fa-solid fa-moon text-slate-600';
            }
        }

        themeToggleBtn.addEventListener('click', () => {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('taskmaster_theme', isDark ? 'dark' : 'light');
            themeIcon.className = isDark ? 'fa-solid fa-sun text-amber-400' : 'fa-solid fa-moon text-slate-600';
            showToast(`已切換為 ${isDark ? '深色' : '淺色'} 模式`, 'info');
        });

        // Add Task
        addTaskForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const title = taskTitleInput.value.trim();
            if (!title) return;

            const newTask = {
                id: Date.now().toString(),
                title: title,
                category: taskCategoryInput.value,
                priority: taskPriorityInput.value,
                dueDate: taskDueDateInput.value,
                completed: false,
                createdAt: Date.now()
            };

            tasks.unshift(newTask);
            saveTasks();
            renderTasks();
            addTaskForm.reset();
            showToast("成功新增待辦事項", "success");
        });

        // Toggle Completed Status
        function toggleTask(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                saveTasks();
                renderTasks();

                if (task.completed) {
                    showToast("重大的成就！任務已完成 🎉", "success");
                    checkAllCompletedConfetti();
                }
            }
        }

        // Delete Task
        function deleteTask(id) {
            showConfirmDialog("確定要刪除此事項？", "此動作將無法撤銷。", () => {
                tasks = tasks.filter(t => t.id !== id);
                saveTasks();
                renderTasks();
                showToast("已刪除該待辦事項", "info");
            });
        }

        // Edit Task Modal Functions
        function openEditModal(id) {
            const task = tasks.find(t => t.id === id);
            if (!task) return;

            editTaskId.value = task.id;
            editTaskTitle.value = task.title;
            editTaskCategory.value = task.category || '一般';
            editTaskPriority.value = task.priority || 'medium';
            editTaskDueDate.value = task.dueDate || '';

            editModal.classList.remove('hidden');
            requestAnimationFrame(() => {
                editModal.classList.remove('opacity-0');
                editModalContent.classList.remove('scale-95');
                editModalContent.classList.add('scale-100');
            });
        }

        function closeEditModal() {
            editModal.classList.add('opacity-0');
            editModalContent.classList.remove('scale-100');
            editModalContent.classList.add('scale-95');
            setTimeout(() => {
                editModal.classList.add('hidden');
            }, 200);
        }

        editTaskForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const id = editTaskId.value;
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.title = editTaskTitle.value.trim();
                task.category = editTaskCategory.value;
                task.priority = editTaskPriority.value;
                task.dueDate = editTaskDueDate.value;
                saveTasks();
                renderTasks();
                closeEditModal();
                showToast("變更已成功儲存", "success");
            }
        });

        cancelEditBtn.addEventListener('click', closeEditModal);

        // Custom Confirm Modal
        function showConfirmDialog(title, message, onConfirm) {
            confirmTitle.textContent = title;
            confirmMessage.textContent = message;
            confirmCallback = onConfirm;

            confirmModal.classList.remove('hidden');
            requestAnimationFrame(() => {
                confirmModal.classList.remove('opacity-0');
            });
        }

        function closeConfirmModal() {
            confirmModal.classList.add('opacity-0');
            setTimeout(() => {
                confirmModal.classList.add('hidden');
                confirmCallback = null;
            }, 200);
        }

        confirmOkBtn.addEventListener('click', () => {
            if (confirmCallback) confirmCallback();
            closeConfirmModal();
        });

        confirmCancelBtn.addEventListener('click', closeConfirmModal);

        // Clear Completed Tasks
        clearCompletedBtn.addEventListener('click', () => {
            const completedCount = tasks.filter(t => t.completed).length;
            if (completedCount === 0) return;

            showConfirmDialog(
                `清理 ${completedCount} 個已完成項目？`,
                "確定要刪除所有標記為已完成的待辦事項嗎？",
                () => {
                    tasks = tasks.filter(t => !t.completed);
                    saveTasks();
                    renderTasks();
                    showToast(`已清空 ${completedCount} 個項目`, "info");
                }
            );
        });

        // Filters & Search Event Listeners
        categoryFilterContainer.addEventListener('click', (e) => {
            const btn = e.target.closest('.filter-tab');
            if (!btn) return;

            document.querySelectorAll('.filter-tab').forEach(b => {
                b.classList.remove('bg-sky-600', 'text-white', 'shadow-sm');
                b.classList.add('bg-white', 'dark:bg-slate-800', 'text-slate-600', 'dark:text-slate-300', 'border', 'border-slate-200', 'dark:border-slate-700');
            });

            btn.classList.remove('bg-white', 'dark:bg-slate-800', 'text-slate-600', 'dark:text-slate-300', 'border', 'border-slate-200', 'dark:border-slate-700');
            btn.classList.add('bg-sky-600', 'text-white', 'shadow-sm');

            currentFilter = btn.dataset.filter;
            renderTasks();
        });

        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value.toLowerCase().trim();
            renderTasks();
        });

        sortSelect.addEventListener('change', (e) => {
            currentSort = e.target.value;
            renderTasks();
        });

        // Main Render Function
        function renderTasks() {
            // 1. Filter Tasks
            let filtered = tasks.filter(task => {
                if (currentFilter === 'active') return !task.completed;
                if (currentFilter === 'completed') return task.completed;
                return true;
            });

            if (searchQuery) {
                filtered = filtered.filter(task => 
                    task.title.toLowerCase().includes(searchQuery) ||
                    (task.category && task.category.toLowerCase().includes(searchQuery))
                );
            }

            // 2. Sort Tasks
            filtered.sort((a, b) => {
                if (currentSort === 'created-desc') return b.createdAt - a.createdAt;
                if (currentSort === 'created-asc') return a.createdAt - b.createdAt;
                if (currentSort === 'priority-desc') {
                    const pMap = { high: 3, medium: 2, low: 1 };
                    return (pMap[b.priority] || 0) - (pMap[a.priority] || 0);
                }
                if (currentSort === 'date-asc') {
                    if (!a.dueDate) return 1;
                    if (!b.dueDate) return -1;
                    return a.dueDate.localeCompare(b.dueDate);
                }
                return 0;
            });

            // 3. Render Items
            taskList.innerHTML = '';

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');

                filtered.forEach(task => {
                    const li = document.createElement('li');
                    li.className = `task-enter bg-white dark:bg-slate-800 border rounded-2xl p-4 flex items-center justify-between gap-3 shadow-sm transition hover:shadow-md ${
                        task.completed ? 'border-slate-200/60 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-800/40' : 'border-slate-200 dark:border-slate-700'
                    }`;

                    // Priority badges
                    const priorityConfig = {
                        high: { color: 'text-red-600 bg-red-50 dark:bg-red-950/40 border-red-200 dark:border-red-800/50', label: '高' },
                        medium: { color: 'text-amber-600 bg-amber-50 dark:bg-amber-950/40 border-amber-200 dark:border-amber-800/50', label: '中' },
                        low: { color: 'text-emerald-600 bg-emerald-50 dark:bg-emerald-950/40 border-emerald-200 dark:border-emerald-800/50', label: '低' }
                    };
                    const pStyle = priorityConfig[task.priority] || priorityConfig.medium;

                    // Due date alert check
                    let dateDisplay = '';
                    if (task.dueDate) {
                        const isOverdue = !task.completed && task.dueDate < getTodayDateString();
                        const isToday = !task.completed && task.dueDate === getTodayDateString();
                        const dateBadgeColor = isOverdue ? 'text-red-500 font-semibold' : (isToday ? 'text-amber-500 font-semibold' : 'text-slate-400');
                        dateDisplay = `<span class="text-xs ${dateBadgeColor} flex items-center gap-1">
                            <i class="fa-regular fa-clock"></i> ${task.dueDate} ${isOverdue ? '(已逾期)' : (isToday ? '(今天到期)' : '')}
                        </span>`;
                    }

                    li.innerHTML = `
                        <div class="flex items-center gap-3.5 flex-1 min-w-0">
                            <!-- Custom Checkbox -->
                            <button onclick="toggleTask('${task.id}')" class="w-6 h-6 rounded-lg border-2 flex items-center justify-center transition-all ${
                                task.completed 
                                    ? 'bg-sky-600 border-sky-600 text-white' 
                                    : 'border-slate-300 dark:border-slate-600 hover:border-sky-500'
                            }">
                                ${task.completed ? '<i class="fa-solid fa-check text-xs"></i>' : ''}
                            </button>

                            <!-- Content -->
                            <div class="flex flex-col min-w-0 flex-1">
                                <span class="text-sm font-medium ${
                                    task.completed ? 'line-through text-slate-400 dark:text-slate-500' : 'text-slate-800 dark:text-slate-100'
                                } truncate">
                                    ${escapeHtml(task.title)}
                                </span>
                                
                                <div class="flex flex-wrap items-center gap-2 mt-1">
                                    <!-- Category Pill -->
                                    <span class="text-[10px] px-2 py-0.5 rounded-md bg-slate-100 dark:bg-slate-700/60 text-slate-600 dark:text-slate-300 font-medium">
                                        ${escapeHtml(task.category || '一般')}
                                    </span>
                                    <!-- Priority Pill -->
                                    <span class="text-[10px] px-2 py-0.5 rounded-md border font-medium ${pStyle.color}">
                                        ${pStyle.label}優先度
                                    </span>
                                    ${dateDisplay}
                                </div>
                            </div>
                        </div>

                        <!-- Actions Buttons -->
                        <div class="flex items-center gap-1">
                            <button onclick="openEditModal('${task.id}')" title="編輯" class="p-2 text-slate-400 hover:text-sky-500 dark:hover:text-sky-400 transition rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700">
                                <i class="fa-solid fa-pen text-xs sm:text-sm"></i>
                            </button>
                            <button onclick="deleteTask('${task.id}')" title="刪除" class="p-2 text-slate-400 hover:text-red-500 transition rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700">
                                <i class="fa-regular fa-trash-can text-xs sm:text-sm"></i>
                            </button>
                        </div>
                    `;
                    taskList.appendChild(li);
                });
            }

            // 4. Update Stats & Progress Bar
            updateStats();
        }

        function updateStats() {
            const total = tasks.length;
            const completed = tasks.filter(t => t.completed).length;
            const percentage = total === 0 ? 0 : Math.round((completed / total) * 100);

            progressBar.style.width = `${percentage}%`;
            statsText.textContent = `${percentage}% (${completed} / ${total} 已完成)`;
            itemsLeftCount.textContent = `${total - completed} 個未完成項目`;

            clearCompletedBtn.disabled = completed === 0;
        }

        // Confetti effect when completing all tasks
        function checkAllCompletedConfetti() {
            const total = tasks.length;
            const completed = tasks.filter(t => t.completed).length;
            if (total > 0 && total === completed && typeof confetti === 'function') {
                confetti({
                    particleCount: 80,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            }
        }

        // Helper: Escape HTML string
        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, function(m) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                }[m];
            });
        }

        // Export Data JSON
        document.getElementById('exportDataBtn').addEventListener('click', () => {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(tasks, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `taskmaster_backup_${getTodayDateString()}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            showToast("備份檔已成功匯出", "success");
        });

        // Import Data JSON
        document.getElementById('importDataInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const importedTasks = JSON.parse(event.target.result);
                    if (Array.isArray(importedTasks)) {
                        tasks = importedTasks;
                        saveTasks();
                        renderTasks();
                        showToast("成功匯入待辦資料", "success");
                    } else {
                        throw new Error("無效的資料格式");
                    }
                } catch (err) {
                    showToast("匯入失敗：格式不符合 JSON 要求", "error");
                }
            };
            reader.readAsText(file);
            e.target.value = ''; // Reset input
        });

        // Display Current Date Header
        function updateDateDisplay() {
            const now = new Date();
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            currentDateText.textContent = now.toLocaleDateString('zh-TW', options);
        }

        // App Boot initialization
        window.onload = function() {
            initTheme();
            updateDateDisplay();
            loadTasks();
            renderTasks();
        };
    </script>
</body>
</html>
